<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intro — Cam&Co Closing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #00ffaa;
      --blue: #0ea5e9;
      --bg: #06090f;
    }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: none;
    }

    /* ── CUSTOM CURSOR ── */
    #cursor {
      position: fixed;
      width: 10px; height: 10px;
      background: var(--green);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform .1s, width .3s, height .3s, opacity .3s;
      mix-blend-mode: screen;
    }

    #cursor-ring {
      position: fixed;
      width: 36px; height: 36px;
      border: 1px solid rgba(0,255,170,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform .18s ease, width .3s, height .3s;
    }

    /* ── CANVAS BACKGROUND ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* ── SCANLINES ── */
    .scanlines {
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.08) 3px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 5;
    }

    /* ── VIGNETTE ── */
    .vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
      z-index: 4;
    }

    /* ── MAIN INTRO WRAPPER ── */
    #intro {
      position: fixed; inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    /* ── TOP LINE ── */
    .top-line {
      position: absolute;
      top: 40px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0;
      animation: fadeIn .6s 0.2s ease forwards;
    }

    .top-line-bar {
      width: 40px; height: 1px;
      background: rgba(0,255,170,0.4);
    }

    .top-line-text {
      font-size: 11px;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: rgba(0,255,170,0.6);
      font-weight: 500;
    }

    /* ── LOGO ── */
    .logo-wrap {
      opacity: 0;
      animation: riseIn .9s 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
      margin-bottom: 8px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 16vw, 13rem);
      line-height: .9;
      letter-spacing: .04em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.12);
      position: relative;
    }

    .logo-fill {
      position: absolute;
      inset: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 16vw, 13rem);
      line-height: .9;
      letter-spacing: .04em;
      background: linear-gradient(135deg, #ffffff 0%, var(--green) 60%, var(--blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      clip-path: inset(100% 0 0 0);
      animation: revealUp 1.2s 0.8s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    /* ── TAGLINE ── */
    .tagline-wrap {
      overflow: hidden;
      margin-bottom: 48px;
    }

    .tagline {
      font-size: clamp(.85rem, 1.8vw, 1.1rem);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #4a6080;
      font-weight: 300;
      transform: translateY(100%);
      animation: slideUp .8s 1.4s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .tagline span { color: rgba(0,255,170,0.7); }

    /* ── FOR BADGE ── */
    .for-badge {
      opacity: 0;
      animation: fadeIn .6s 1.8s ease forwards;
      margin-bottom: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .for-badge-line { width: 32px; height: 1px; background: rgba(255,255,255,0.1); }

    .for-badge-text {
      font-size: 12px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #2a3a50;
    }

    .for-badge-name {
      font-size: 13px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 500;
    }

    /* ── ENTER BUTTON ── */
    .enter-wrap {
      opacity: 0;
      animation: fadeIn .8s 2.2s ease forwards;
    }

    .enter-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 18px 44px;
      background: transparent;
      border: 1px solid rgba(0,255,170,0.3);
      border-radius: 4px;
      color: var(--green);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: none;
      text-decoration: none;
      overflow: hidden;
      transition: border-color .3s, color .3s;
    }

    .enter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,255,170,0.08), rgba(14,165,233,0.08));
      opacity: 0;
      transition: opacity .3s;
    }

    .enter-btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0%; height: 1px;
      background: linear-gradient(90deg, var(--green), var(--blue));
      transition: width .4s ease;
    }

    .enter-btn:hover::before { opacity: 1; }
    .enter-btn:hover::after { width: 100%; }
    .enter-btn:hover { border-color: rgba(0,255,170,0.6); }

    .enter-arrow {
      width: 20px; height: 1px;
      background: var(--green);
      position: relative;
      transition: width .3s;
    }

    .enter-arrow::after {
      content: '';
      position: absolute;
      right: 0; top: -3px;
      width: 6px; height: 6px;
      border-right: 1px solid var(--green);
      border-top: 1px solid var(--green);
      transform: rotate(45deg);
    }

    .enter-btn:hover .enter-arrow { width: 32px; }

    /* ── GLITCH LINES ── */
    .glitch-line {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,255,170,0.6), transparent);
      opacity: 0;
      animation: glitch 8s infinite;
    }

    .glitch-line:nth-child(1) { top: 30%; animation-delay: 0s; }
    .glitch-line:nth-child(2) { top: 60%; animation-delay: 3s; }
    .glitch-line:nth-child(3) { top: 80%; animation-delay: 5.5s; }

    /* ── CORNER BRACKETS ── */
    .corner {
      position: absolute;
      width: 28px; height: 28px;
      opacity: 0;
      animation: fadeIn .5s 2.6s ease forwards;
    }

    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: rgba(0,255,170,0.35);
    }

    .corner::before { width: 100%; height: 1px; top: 0; left: 0; }
    .corner::after  { width: 1px; height: 100%; top: 0; left: 0; }

    .corner.tl { top: 24px; left: 24px; }
    .corner.tr { top: 24px; right: 24px; transform: scaleX(-1); }
    .corner.bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
    .corner.br { bottom: 24px; right: 24px; transform: scale(-1); }

    /* ── BOTTOM STATUS ── */
    .status-bar {
      position: absolute;
      bottom: 36px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 24px;
      opacity: 0;
      animation: fadeIn .6s 2.8s ease forwards;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #1e2d40;
    }

    .status-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .2; }
    }

    /* ── TRANSITION OUT ── */
    #overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 100;
      pointer-events: none;
      opacity: 0;
    }

    #overlay.closing {
      animation: fadeOut .8s ease forwards;
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    @keyframes revealUp {
      from { clip-path: inset(100% 0 0 0); }
      to   { clip-path: inset(0% 0 0 0); }
    }

    @keyframes glitch {
      0%, 90%, 100% { opacity: 0; transform: scaleX(0) translateX(-50%); }
      92% { opacity: 1; transform: scaleX(.3) translateX(20%); }
      94% { opacity: .5; transform: scaleX(.8) translateX(-10%); }
      96% { opacity: 0; }
    }

    @keyframes fadeOut {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="overlay"></div>

<canvas id="bg-canvas"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- GLITCH LINES -->
<div class="glitch-line"></div>
<div class="glitch-line"></div>
<div class="glitch-line"></div>

<!-- CORNER BRACKETS -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<section id="intro">

  <div class="top-line">
    <div class="top-line-bar"></div>
    <div class="top-line-text">E-Book Premium · 2026</div>
    <div class="top-line-bar"></div>
  </div>

  <div class="logo-wrap">
    <div class="logo" style="position:relative; display:inline-block;">
      CAM&amp;CO
      <div class="logo-fill">CAM&amp;CO</div>
    </div>
  </div>

  <div class="tagline-wrap">
    <div class="tagline">Closing Téléphonique <span>·</span> Sécurité & Surveillance</div>
  </div>

  <div class="for-badge">
    <div class="for-badge-line"></div>
    <div class="for-badge-text">Conçu pour</div>
    <div class="for-badge-name">Mélina</div>
    <div class="for-badge-line"></div>
  </div>

  <div class="enter-wrap">
    <a href="ebook_closing_securite_melina.html" class="enter-btn" id="enter-btn">
      Accéder à l'e-book
      <div class="enter-arrow"></div>
    </a>
  </div>

  <div class="status-bar">
    <div class="status-item"><div class="status-dot"></div>Système actif</div>
    <div class="status-item">·</div>
    <div class="status-item">Psychologie · Scripts · Objections</div>
  </div>

</section>

<script>
  // ── CANVAS PARTICLE GRID ──
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], mouse = { x: -999, y: -999 };

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initParticles() {
    particles = [];
    const cols = Math.floor(W / 80);
    const rows = Math.floor(H / 80);
    for (let i = 0; i <= cols; i++) {
      for (let j = 0; j <= rows; j++) {
        particles.push({
          x: (W / cols) * i,
          y: (H / rows) * j,
          ox: (W / cols) * i,
          oy: (H / rows) * j,
          vx: 0, vy: 0,
          size: Math.random() * 1.2 + .3,
          alpha: Math.random() * .3 + .05
        });
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Draw connections
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 100) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(0,255,170,${.04 * (1 - dist/100)})`;
          ctx.lineWidth = .5;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }

    // Draw & update particles
    particles.forEach(p => {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const force = Math.max(0, (120 - dist) / 120);

      p.vx += (p.ox - p.x) * .05 - (dx / dist || 0) * force * 2;
      p.vy += (p.oy - p.y) * .05 - (dy / dist || 0) * force * 2;
      p.vx *= .85; p.vy *= .85;
      p.x += p.vx; p.y += p.vy;

      const glow = force > 0.1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, glow ? p.size * 2.5 : p.size, 0, Math.PI * 2);
      ctx.fillStyle = glow
        ? `rgba(0,255,170,${p.alpha * 3})`
        : `rgba(0,255,170,${p.alpha})`;
      ctx.fill();
    });

    // Scan line sweep
    const sweep = (Date.now() / 8000 % 1) * H;
    const grad = ctx.createLinearGradient(0, sweep - 60, 0, sweep + 60);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(.5, 'rgba(0,255,170,0.025)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, sweep - 60, W, 120);

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); initParticles(); });
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

  resize();
  initParticles();
  draw();

  // ── CUSTOM CURSOR ──
  const cur = document.getElementById('cursor');
  const ring = document.getElementById('cursor-ring');
  let rx = 0, ry = 0;

  window.addEventListener('mousemove', e => {
    cur.style.left = e.clientX + 'px';
    cur.style.top  = e.clientY + 'px';
    rx += (e.clientX - rx) * .12;
    ry += (e.clientY - ry) * .12;
  });

  function updateRing() {
    ring.style.left = rx + 'px';
    ring.style.top  = ry + 'px';
    requestAnimationFrame(updateRing);
  }
  updateRing();

  document.querySelectorAll('a, button').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cur.style.width = '6px'; cur.style.height = '6px';
      ring.style.width = '56px'; ring.style.height = '56px';
    });
    el.addEventListener('mouseleave', () => {
      cur.style.width = '10px'; cur.style.height = '10px';
      ring.style.width = '36px'; ring.style.height = '36px';
    });
  });

  // ── ENTER TRANSITION ──
  document.getElementById('enter-btn').addEventListener('click', function(e) {
    e.preventDefault();
    const target = this.href;
    const ov = document.getElementById('overlay');
    ov.classList.add('closing');
    setTimeout(() => { window.location.href = target; }, 800);
  });
</script>
</body>
</html>
